# Supabase pausa los proyectos gratuitos que pasan 7 días sin actividad.
# Esta tarea hace una consulta de solo lectura a la base cada 3 días para que el proyecto siga activo.
# También se puede correr a mano desde la pestaña Actions de GitHub.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar las salas
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://tdteoafnspihvtjgdqtf.supabase.co/rest/v1/salas?select=id&limit=1" \
            -H "apikey: sb_publishable_A62z-Zn6cHWR3XibN4ntqA_dNXl91y9"
