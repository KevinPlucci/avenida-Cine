# Supabase pausa los proyectos gratuitos que pasan 7 días sin actividad.
# Una consulta de solo lectura no alcanzó para evitarlo, así que esta tarea llama cada 2 días a la función
# latido(), que actualiza una fecha en la base (una escritura mínima, sin datos de usuarios).
# También se puede correr a mano desde la pestaña Actions de GitHub.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar actividad en la base
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST \
            "https://tdteoafnspihvtjgdqtf.supabase.co/rest/v1/rpc/latido" \
            -H "apikey: sb_publishable_A62z-Zn6cHWR3XibN4ntqA_dNXl91y9" \
            -H "Content-Type: application/json" \
            -d '{}'
